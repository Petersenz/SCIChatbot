# REVIEW CANDIDATE ONLY. Include inside the existing cstack.space HTTPS server.
# Application source, .env and database archives stay OUTSIDE /var/www.
location = /sci-chatbot {
    return 308 /sci-chatbot/;
}

location ^~ /sci-chatbot/ {
    proxy_pass http://127.0.0.1:3110;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 34m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_cookie_path / /sci-chatbot/;
    proxy_cookie_flags sci_auth secure httponly samesite=strict;
    proxy_cookie_flags sci_guest secure httponly samesite=strict;
}
